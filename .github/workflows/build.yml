name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The documentation is deployed to GitHub Pages, which allows one deployment at
# a time; queue rather than cancel so that the last push always wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"

      - name: Install dependencies
        run: opam install --yes --deps-only --with-test --with-doc .

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune test --force

      - name: Build documentation
        run: |
          opam install --yes odoc
          opam exec -- dune build @doc

      - name: Upload documentation
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _build/default/_doc/_html

  deploy-doc:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
